<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AileTakip</title><link rel="stylesheet" href="style.css"></head><body><header><b>Aile<span>Takip</span></b><nav><a href="#map">Harita</a><a href="#family">Ailem</a><a href="#history">Geçmiş</a></nav><button id="logout">Çıkış</button></header><main><section id="auth"><div class="card"><small>GERÇEK UYGULAMA</small><h1>Ailenizle <em>güvenli</em> bağlantı.</h1><p>Hesap oluşturun. Konum paylaşımı yalnızca açık izninizle çalışır.</p><div><button class="tab on" id="loginTab">Giriş Yap</button><button class="tab" id="registerTab">Kayıt Ol</button></div><form id="authForm"><input id="email" type="email" placeholder="E-posta" required><input id="password" type="password" placeholder="Şifre (en az 6 karakter)" minlength="6" required><button class="primary" id="authSubmit">Giriş Yap</button></form><p id="msg"></p></div></section><section id="app"><div class="heading"><div><small>AİLETAKİP</small><h2>Kontrol Merkezi</h2></div><span id="status">● Konum paylaşımı kapalı</span></div><div class="layout"><article class="panel" id="map"><h3>Aile Haritası <button id="locate">Konumumu Bul</button></h3><div class="map"><i id="pin"></i><label>Konum izni verildiğinde konumunuz burada görünür.</label></div><button class="primary" id="share">Konum Paylaşımını Aç</button><button class="danger" id="stop">Paylaşımı Durdur</button></article><aside><article class="panel" id="family"><h3>Ailem</h3><input id="familyName" placeholder="Aile adı"><button class="primary" id="create">Aile Oluştur</button><hr><input id="code" placeholder="Davet kodu"><button id="join">Koda Katıl</button><p id="familyInfo"></p></article><article class="panel" id="history"><h3>Konum Geçmişim</h3><div id="historyList">Henüz kayıt yok.</div></article></aside></div></section></main><div id="toast"></div><script type="module" src="app.js"></script></body></html>
